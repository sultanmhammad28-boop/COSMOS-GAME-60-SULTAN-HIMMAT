name: Build COSMOS GAME APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download project
    uses: actions/checkout@v4

  - name: Install Java and dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

  - name: Install Buildozer
    run: |
      python3 -m venv venv
      . venv/bin/activate
      pip install --upgrade pip setuptools
      pip install buildozer cython==0.29.36

  - name: Build Android APK
    run: |
      . venv/bin/activate
      buildozer android debug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: COSMOS-GAME-60-APK
      path: bin/*.apk
      if-no-files-found: error
